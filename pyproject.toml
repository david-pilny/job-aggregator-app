[project]
name = "jobagg"
version = "0.1.0"
description = "Personal job aggregator: scrape, dedupe, score, notify."
requires-python = ">=3.11"
dependencies = [
    "python-jobspy>=1.1.80",
    "httpx>=0.27",
    "selectolax>=0.3",
    "pydantic>=2.7",
    "rapidfuzz>=3.9",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "click>=8.1",
]

[project.scripts]
jobs = "jobagg.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobagg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
